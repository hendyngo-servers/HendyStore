services:
  - type: web
    name: hendy-store
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api.php?action=health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: STORE_NAME
        value: Hendy Store
      - key: APP_URL
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_PUBLIC_SIGNUP
        value: "false"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: NEON_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: NEON_STORAGE_BUCKET
        value: hendy-store-files
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: NEON_AI_MODEL
        value: gpt-5-mini
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: NEON_STORE_FUNCTION_URL
        sync: false
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: FORCE_SECURE_COOKIES
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "209715200"
