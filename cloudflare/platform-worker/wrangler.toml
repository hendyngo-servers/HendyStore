name = "hendy-platform-api"
main = "src/index.ts"
account_id = "918ff2f016938fc978ed23b96505b21e"
compatibility_date = "2026-11-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
HENDY_API_ORIGIN = "https://hendystore.onrender.com"
CLOUDFLARE_ACCOUNT_ID = "918ff2f016938fc978ed23b96505b21e"
OBJECT_STORAGE_JURISDICTION = "eu"
ALLOWED_ORIGINS = "https://hendystore.onrender.com,https://hendystore-pages.pages.dev"
DATABASE_PROVIDER = "origin"
OBJECT_STORAGE_PROVIDER = "r2"
OBJECT_STORAGE_ENDPOINT = "https://918ff2f016938fc978ed23b96505b21e.eu.r2.cloudflarestorage.com"
OBJECT_STORAGE_BUCKET = "hendy-store"
OBJECT_STORAGE_REGION = "auto"
OBJECT_STORAGE_FORCE_PATH_STYLE = "true"
LEGACY_ORIGIN_PROXY = "true"

[[r2_buckets]]
binding = "R2"
bucket_name = "hendy-store"
jurisdiction = "eu"

