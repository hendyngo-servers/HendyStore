name = "hendy-platform-api"
main = "src/index.ts"
account_id = "918ff2f016938fc978ed23b96505b21e"
compatibility_date = "2026-11-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
HENDY_API_ORIGIN = "https://hendystore.onrender.com"
CLOUDFLARE_ACCOUNT_ID = "918ff2f016938fc978ed23b96505b21e"
OBJECT_STORAGE_JURISDICTION = "eu"
DATABASE_PROVIDER = "origin"
OBJECT_STORAGE_PROVIDER = "neon"
OBJECT_STORAGE_REGION = "auto"
OBJECT_STORAGE_FORCE_PATH_STYLE = "true"
LEGACY_ORIGIN_PROXY = "true"

# Configure these bindings in Cloudflare after signing in.
# [[d1_databases]]
# binding = "DB"
# database_name = "hendy-store-edge"
# database_id = "<D1_DATABASE_ID>"
#
# Optional KV cache for the public catalogue only.
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<KV_NAMESPACE_ID>"
#
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "<R2_BUCKET_NAME>"
#
